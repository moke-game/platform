name: Go
on: [pull_request]
jobs:
  test:
    permissions:
      contents: read
      pull-requests: read
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Test
        run: go test -v -race -coverpkg=./... -coverprofile=coverage.txt ./...

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        # go run of x/vuln switches to the tool's go 1.26 toolchain unless we pin;
        # this module and x/net 0.59 require Go 1.27 export data.
        run: GOTOOLCHAIN=go1.27.0 go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          only-new-issues: true

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1

      - name: buf breaking
        uses: bufbuild/buf-breaking-action@v1
        with:
          against: "https://github.com/${{ github.repository }}.git#branch=main"

      - uses: codecov/codecov-action@v3
